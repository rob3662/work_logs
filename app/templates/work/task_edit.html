{% extends "base.html" %}
{% block title %}Edit task — {{ app_name }}{% endblock %}
{% block content %}
<h1 class="mb-3">Edit task</h1>
<p class="text-muted">Session: <strong>{{ session.project }}</strong> · {{ session.work_date }}</p>
<form method="post" class="col-lg-8">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="mb-3">
    <label class="form-label" for="task_text">Task</label>
    <textarea class="form-control" id="task_text" name="task_text" rows="3" maxlength="4000" required>{{ task.task_text }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a class="btn btn-outline-secondary ms-2" href="{{ url_for('work.session_detail', session_id=session.id) }}">Cancel</a>
</form>
{% endblock %}
