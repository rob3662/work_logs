{% extends "base.html" %}
{% block title %}Not found — {{ app_name }}{% endblock %}
{% block content %}
<div class="col-lg-8 py-4">
  <h1 class="mb-2">Page not found</h1>
  <p class="text-muted mb-4">That URL does not match anything in {{ app_name }}.</p>
  <a class="btn btn-primary" href="{{ url_for('main.index') }}">Go home</a>
</div>
{% endblock %}
