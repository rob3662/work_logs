{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h2 mb-2">Log in</h1>
    <p class="text-muted mb-4">Welcome back to {{ app_name }}.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <div class="mb-3 form-check">
        <input class="form-check-input" type="checkbox" name="remember_me" id="remember_me">
        <label class="form-check-label" for="remember_me">Remember me</label>
      </div>
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <button type="submit" class="btn btn-primary">Log in</button>
        <a class="btn btn-link" href="{{ url_for('auth.forgot_password') }}">Forgot password</a>
      </div>
    </form>
    <p class="small text-muted mb-0">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
  </div>
</div>
{% endblock %}
